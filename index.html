<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理治療動作資料庫</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <h1>物理治療動作資料庫</h1>
        </div>
    </header>

    <main class="container">
        <section class="filters-section">
            <div class="filter-group">
                <span class="filter-label">類型</span>
                <div class="filter-buttons" data-filter-group="category">
                    <button class="filter-btn active" data-value="all">全部</button>
                    <button class="filter-btn strength-btn" data-value="strength">肌力</button>
                    <button class="filter-btn mobility-btn" data-value="mobility">活動度</button>
                    <button class="filter-btn control-btn" data-value="control">控制</button>
                </div>
            </div>
            <div class="filter-group subtype-group" id="subtype-group">
                <span class="filter-label">活動度</span>
                <div class="filter-buttons" data-filter-group="subtype">
                    <button class="filter-btn active" data-value="all">全部</button>
                    <button class="filter-btn stretching-btn" data-value="stretching">Stretching</button>
                    <button class="filter-btn rom-btn" data-value="rom">ROM</button>
                    <button class="filter-btn jointplay-btn" data-value="jointplay">Joint Play</button>
                </div>
            </div>
            <div class="filter-group">
                <span class="filter-label">難易度</span>
                <div class="filter-buttons" data-filter-group="level">
                    <button class="filter-btn active" data-value="all">全部</button>
                    <button class="filter-btn beginner-btn" data-value="beginner">初階</button>
                    <button class="filter-btn intermediate-btn" data-value="intermediate">中階</button>
                    <button class="filter-btn advanced-btn" data-value="advanced">進階</button>
                </div>
            </div>

            <div class="filter-group">
                <span class="filter-label">關節</span>
                <div class="filter-buttons" data-filter-group="joint">
                    <button class="filter-btn active" data-value="all">全部</button>
                    <button class="filter-btn" data-value="頸椎">頸椎</button>
                    <button class="filter-btn" data-value="胸椎">胸椎</button>
                    <button class="filter-btn" data-value="腰椎">腰椎</button>
                    <button class="filter-btn" data-value="核心">核心</button>
                    <button class="filter-btn" data-value="肩">肩</button>
                    <button class="filter-btn" data-value="肘">肘</button>
                    <button class="filter-btn" data-value="腕">腕</button>
                    <button class="filter-btn" data-value="髖">髖</button>
                    <button class="filter-btn" data-value="膝">膝</button>
                    <button class="filter-btn" data-value="踝">踝</button>
                    <button class="filter-btn" data-value="全身">全身</button>
                </div>
            </div>
        </section>

        <div class="results-bar">
            <span id="result-count"></span>
            <button class="reset-btn" id="reset-btn">重設篩選</button>
        </div>

        <section class="exercise-grid" id="exercise-grid"></section>

        <div class="empty-state" id="empty-state">
            <p>沒有符合條件的動作</p>
        </div>

        <div class="pagination" id="pagination"></div>
    </main>

                    v30308v30308@gmail.com

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close" aria-label="關閉">✕</button>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" role="dialog">
            <button class="modal-close" id="modal-close" aria-label="關閉">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
